# Tremulous Overmind – static client + websocket gateway, behind Cloudflare.
# The host firewall only admits Cloudflare on 80/443, so CF-Connecting-IP is trustworthy here.

map $http_cf_connecting_ip $trem_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone  $trem_client_ip zone=trem_page:10m rate=10r/s;
limit_req_zone  $trem_client_ip zone=trem_ws:10m   rate=2r/s;
limit_conn_zone $trem_client_ip zone=trem_conn:10m;

map $http_upgrade $trem_connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __TREM_HOST__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __TREM_HOST__;

    ssl_certificate     /etc/ssl/tremulous/origin.crt;
    ssl_certificate_key /etc/ssl/tremulous/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/tremulous/web/current;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;
    access_log /var/log/nginx/tremulous.access.log;
    error_log  /var/log/nginx/tremulous.error.log warn;

    # nothing here accepts input
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://webnova360.com wss://__TREM_HOST__; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "fullscreen=(self), gamepad=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Overmind "1" always;

    location ~ /\. { deny all; }

    # public URL is webnova360.com/play-tremulous/ (Cloudflare Worker forwards the path
    # unchanged); the release is built with that base, files live at the root here
    location = / { return 301 https://webnova360.com/play-tremulous/; }
    location = /play-tremulous { return 301 https://webnova360.com/play-tremulous/; }
    location ^~ /play-tremulous/ {
        rewrite ^/play-tremulous/$ /index.html last;
        rewrite ^/play-tremulous/(.+)$ /$1 last;
    }

    location / {
        limit_req zone=trem_page burst=40 nodelay;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/tremulous-headers.conf;
    }

    # content-addressed game data (<crc32>-<name>.pk3): cache forever
    location ~ ^/assets/\d+-[A-Za-z0-9._-]+\.pk3$ {
        limit_req zone=trem_page burst=60 nodelay;
        types { application/octet-stream pk3; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/tremulous-headers.conf;
    }
    location = /assets/manifest.json {
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        include /etc/nginx/snippets/tremulous-headers.conf;
    }

    # engine: the wasm name carries its content hash, the loader is requested as
    # tremulous.js?v=<hash>, so both can be cached hard without ever mixing builds
    location ~ ^/tremulous\.[0-9a-z]+\.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/tremulous-headers.conf;
    }
    location = /tremulous.js {
        types { text/javascript js; }
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/tremulous-headers.conf;
    }

    location = /status.json {
        alias /opt/tremulous/web/status.json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/tremulous-headers.conf;
    }

    # websocket -> UDP gateways (localhost only)
    location ~ ^/ws/(?<trem_srv>[12])$ {
        limit_req  zone=trem_ws burst=6 nodelay;
        limit_conn trem_conn 4;
        proxy_pass http://127.0.0.1:2796$trem_srv;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $trem_connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
