// Reactor Skirmish – 10 vs 10, quicker rounds
set sv_hostname "^5WebNova360^7 | Reactor Skirmish 10v10"
set g_motd "Presented by WebNova360.com - Tremulous in your browser"
set sv_maxclients 20
set sv_privateClients 0
// pure mode rejects the browser client ("Unpure client detected") although both sides
// carry the same paks; in a browser it adds no real anti-cheat (wasm memory is editable)
set sv_pure 0
set sv_allowDownload 0

// no remote admin over the network
set rconPassword ""
set sv_privatePassword ""

// rate / anti-abuse
set sv_minRate 8000
set sv_maxRate 25000
set sv_minSnaps 10
set sv_floodProtect 1
set sv_timeout 30
set sv_zombietime 2

// match
set g_teamForceBalance 1
set g_suddenDeathTime 15
set timelimit 25
set g_friendlyFire 0
set g_friendlyBuildableFire 1

// bots
set g_bot 1
set g_bot_join 1
set g_bot_fillTeam 10
set g_bot_evolve 1
set g_bot_tagname 1
set g_bot_spawnprotection 2000

set g_initialMapRotation rotation1
map niveus
