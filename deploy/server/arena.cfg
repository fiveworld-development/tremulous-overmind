// Overmind Arena – 20 vs 20, bots keep both teams full
set sv_hostname "^5WebNova360^7 | Overmind Arena 20v20"
set g_motd "Presented by WebNova360.com - Tremulous in your browser"
// slots 0-39 are reserved for bots (nobody knows the private password, it is empty);
// 24 more for real players. Bots shrink as players come, so a match stays 20v20.
set sv_maxclients 64
set sv_privateClients 40
// pure mode rejects the browser client ("Unpure client detected") although both sides
// carry the same paks; in a browser it adds no real anti-cheat (wasm memory is editable)
set sv_pure 0
set sv_allowDownload 0

// no remote admin over the network
set rconPassword ""
set sv_privatePassword ""

// rate / anti-abuse
set sv_minRate 8000
set sv_maxRate 25000
set sv_minSnaps 10
set sv_floodProtect 1
set sv_timeout 30
set sv_zombietime 2

// match
set g_teamForceBalance 1
set g_suddenDeathTime 30
set timelimit 45
set g_friendlyFire 0
set g_friendlyBuildableFire 1

// bots
set g_bot 1
set g_bot_join 1
// 20v20 with exactly one open seat: 39 players (bots + real) at all times
set g_bot_fillTeam 20
// 0 = skill rolled per map, spread per bot
set g_bot_skill 0
set g_bot_evolve 1
set g_bot_tagname 1
set g_bot_spawnprotection 2000

set g_initialMapRotation rotation1
map atcs
